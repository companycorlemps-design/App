<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101a33"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes"><title>CCL Vendè</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:#101a33;color:#16213e;min-height:100vh}
.wrap{max-width:480px;margin:0 auto;padding:16px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px}
h1,h2{margin:0 0 10px}label{display:block;font:700 11px system-ui;color:#75819a;margin:10px 0 4px}
input,select,button{width:100%;padding:13px;border-radius:12px;border:1px solid #d5dbea;font:inherit;background:#fff}
button{background:#3b6ff5;color:#fff;border:0;font-weight:700;margin-top:10px}button.alt{background:#e8edfb;color:#16213e}button.red{background:#d64545}button:disabled{opacity:.5}
.row{display:flex;gap:8px}.row>*{flex:1}.err{background:#fdeeee;color:#b3261e;padding:10px;border-radius:10px;margin-top:10px;display:none}
.code{font:700 15px monospace;background:#eef2ff;padding:8px 10px;border-radius:8px;display:inline-block}
.top{display:flex;justify-content:space-between;align-items:center;color:#fff;margin-bottom:12px}.top small{opacity:.7;display:block}
.top button{width:auto;padding:8px 14px;margin:0;background:#26355e}table{width:100%;border-collapse:collapse;font-size:14px}td{padding:7px 4px;border-bottom:1px solid #eef0f6}
.tot{font:800 22px system-ui}.hide{display:none}.ok{color:#159b72;font-weight:700}
</style></head><body><div class="wrap">

<div id="vLogin"><div class="card"><h1>CCL Vendè</h1>
<p style="margin:0;color:#75819a">Aparèy sa a :</p><span class="code" id="devCode"></span>
<label>NON ITILIZATÈ</label><input id="lUser" autocapitalize="none" autocomplete="username">
<label>MODPAS</label><input id="lPass" type="password" autocomplete="current-password">
<button id="lBtn" onclick="login()">Konekte</button><div class="err" id="lErr"></div></div></div>

<div id="vApp" class="hide">
<div class="top"><div><b id="who"></b><small id="stat"></small></div><button onclick="logout()">Soti</button></div>

<div class="card" id="shiftCard"><h2>Kès la</h2><div id="shiftTxt" style="color:#75819a">Fèmen</div>
<button id="shiftBtn" onclick="toggleShift()">Ouvri kès la</button></div>

<div class="card hide" id="saleCard"><h2>Nouvo vant</h2>
<div class="row"><div><label>LOTERI</label><select id="sLot"><option>Caribbean Lottery</option><option>National Games</option><option>Lucky Draw</option></select></div>
<div><label>TIRAJ</label><select id="sDraw"><option>12:00 — Midi</option><option>15:00 — Après-midi</option><option>19:00 — Soir</option></select></div></div>
<div class="row"><div><label>JWÈT</label><select id="sType"><option>Boule</option><option>Mariage</option><option>Reverse</option><option>Paire</option><option>Loterie combinée</option></select></div>
<div><label>MIZ (HTG)</label><input id="sStake" type="number" inputmode="decimal" min="1" value="10"></div></div>
<label>NIMÈWO</label><input id="sNum" inputmode="numeric" placeholder="Egz. 45 oswa 12-34" maxlength="20">
<button class="alt" onclick="addLine()">+ Ajoute nan panye</button>
<table id="cart"></table><div class="tot" id="total">0 HTG</div>
<label>PEMAN</label><select id="sPay"><option>Espèces</option><option>NatCash</option><option>MonCash</option></select>
<button id="payBtn" onclick="checkout()">Vann tikè a</button></div>

<div class="card hide" id="histCard"><h2>Dènye tikè yo</h2><table id="hist"></table></div>
<div class="err" id="aErr" style="margin-bottom:12px"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL="https://wramzmqqxwistcsznaeo.supabase.co",SB_KEY="sb_publishable_JSeQnkqijAfT1JHQe54GDw_u3fsmfMb";
const $=id=>document.getElementById(id);let sb,prof,sessionId=null,cart=[];
const money=n=>Number(n||0).toLocaleString('fr-FR')+' HTG';
function devCode(){let c=null;try{c=localStorage.getItem('ccl_device_code')}catch(e){}if(!c||c.length<8){const a=new Uint8Array(4);crypto.getRandomValues(a);c='DEV-'+[...a].map(b=>b.toString(16).padStart(2,'0')).join('').toUpperCase();try{localStorage.setItem('ccl_device_code',c)}catch(e){}}return c}
function err(id,m){const e=$(id);e.textContent=m||'';e.style.display=m?'block':'none'}
$('devCode').textContent=devCode();
function init(){if(!window.supabase)return err('lErr','SDK Supabase pa chaje. Verifye entènèt.');sb=supabase.createClient(SB_URL,SB_KEY)}
async function login(){err('lErr');const u=$('lUser').value.trim().toLowerCase(),p=$('lPass').value;if(!u||!p)return err('lErr','Antre non itilizatè ak modpas.');
$('lBtn').disabled=true;try{if(!sb)init();const {error}=await sb.auth.signInWithPassword({email:u.includes('@')?u:u+'@login.ccl.local',password:p});if(error)throw error;
const {data:{user}}=await sb.auth.getUser();const {data:pr,error:pe}=await sb.from('ccl_profiles').select('id,company_id,role,is_active,full_name,username,branch').eq('id',user.id).single();if(pe)throw pe;
if(!pr.is_active)throw new Error('Kont sa a dezaktive.');if(!['seller','cashier'].includes(pr.role))throw new Error('App sa a se sèlman pou vandè. Itilize app admin lan.');
const {data:dv,error:de}=await sb.rpc('ccl_register_device',{p_code:devCode(),p_label:navigator.userAgent.slice(0,100)});if(de)throw de;
if(!dv.allowed)throw new Error(dv.status==='blocked'?'Aparèy sa a bloke. Kontakte administratè a.':'Aparèy sa a poko apwouve. Voye kòd '+devCode()+' bay administratè a.');
prof=pr;$('vLogin').classList.add('hide');$('vApp').classList.remove('hide');$('who').textContent=pr.full_name||pr.username;$('stat').textContent='Aparèy '+devCode();render();loadHist()}
catch(e){if(sb)await sb.auth.signOut();err('lErr',/invalid login/i.test(e.message)?'Non itilizatè oswa modpas pa kòrèk.':e.message)}finally{$('lBtn').disabled=false}}
async function logout(){if(sessionId&&!confirm('Kès la ouvè. Soti kanmenm?'))return;await sb.auth.signOut();location.reload()}
async function terminal(){const {data,error}=await sb.from('ccl_terminals').select('id').eq('company_id',prof.company_id).eq('is_active',true).order('created_at').limit(1);if(error)throw error;if(!data.length)throw new Error('Pa gen tèminal POS.');return data[0].id}
async function toggleShift(){err('aErr');try{if(!sessionId){const {data,error}=await sb.from('ccl_pos_sessions').insert({company_id:prof.company_id,terminal_id:await terminal(),opened_by:prof.id,status:'open'}).select('id').single();if(error)throw error;sessionId=data.id}
else{if(cart.length&&!confirm('Panye a pa vid. Fèmen kès la kanmenm?'))return;const {error}=await sb.from('ccl_pos_sessions').update({status:'closed',closed_by:prof.id,closed_at:new Date().toISOString()}).eq('id',sessionId);if(error)throw error;sessionId=null;cart=[]}render()}catch(e){err('aErr',e.message)}}
function addLine(){err('aErr');const n=$('sNum').value.trim(),u=parseFloat($('sStake').value);if(!/^[0-9][0-9 \-]*$/.test(n))return err('aErr','Nimewo envalid.');if(!(u>0))return err('aErr','Miz envalid.');
cart.push({game_type:$('sType').value,numbers:n,unit_stake:u,line_total:u});$('sNum').value='';render()}
function rm(i){cart.splice(i,1);render()}
function render(){const open=!!sessionId;$('shiftTxt').innerHTML=open?'<span class="ok">Ouvè</span>':'Fèmen';$('shiftBtn').textContent=open?'Fèmen kès la':'Ouvri kès la';$('shiftBtn').className=open?'red':'';
$('saleCard').classList.toggle('hide',!open);$('histCard').classList.remove('hide');
$('cart').innerHTML=cart.map((x,i)=>`<tr><td>${x.game_type}</td><td><b>${x.numbers.replace(/</g,'')}</b></td><td>${money(x.line_total)}</td><td><a href="#" onclick="rm(${i});return false">✕</a></td></tr>`).join('');
$('total').textContent=money(cart.reduce((s,x)=>s+x.line_total,0));$('payBtn').disabled=!cart.length}
async function checkout(){err('aErr');if(!cart.length)return;$('payBtn').disabled=true;try{
const {data,error}=await sb.rpc('ccl_create_pos_ticket',{p_session_id:sessionId,p_terminal_id:await terminal(),p_point_label:prof.branch||'',p_seller_label:prof.full_name||prof.username,p_lottery_name:$('sLot').value,p_draw_label:$('sDraw').value,p_payment_method:$('sPay').value,p_lines:cart,p_device_code:devCode()});
if(error)throw error;const t=data.ticket_code;cart=[];render();loadHist();alert('Tikè vann : '+t+'\nTotal : '+money(data.total_amount))}catch(e){err('aErr',e.message);render()}}
async function loadHist(){const {data}=await sb.from('ccl_tickets').select('ticket_code,total_amount,created_at,status').order('created_at',{ascending:false}).limit(15);
$('hist').innerHTML=(data||[]).map(t=>`<tr><td><b>${t.ticket_code}</b></td><td>${new Date(t.created_at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</td><td>${money(t.total_amount)}</td></tr>`).join('')||'<tr><td style="color:#75819a">Pa gen tikè.</td></tr>'}
init();if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></div></body></html>
